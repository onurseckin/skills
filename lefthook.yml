# Lefthook Git Hooks Configuration
#
# Commit is unblocked (zero checks, no typecheck, no lint) so work can be committed instantly.
# Push is the strict boundary where full validation occurs:
# typecheck, local skill synchronization, and full test coverage.

pre-push:
  commands:
    sync-local:
      run: bun run sync:local
    typecheck:
      run: bun run typecheck
    test-coverage:
      run: bun test --timeout 30000 --parallel --no-isolate tests/unit

