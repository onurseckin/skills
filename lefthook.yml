# Lefthook Git Hooks Configuration
#
# Pre-commit typechecks the whole tree, because types are global and a
# staged-only typecheck would be unsound. Lint and format checks run against
# the staged set only, so a commit is never blocked by unrelated files that a
# concurrent workstream left dirty.
# Commit-msg rejects any AI/tool attribution trailer or generated-with banner.
# Pre-push runs skill synchronization, whole-tree typecheck, and unit tests.
# Zero-tolerance: Pass or error only, zero warnings allowed, fail-fast quality gates.

pre-commit:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    lint:
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: bunx oxlint --deny-warnings {staged_files}
    format-check:
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,md,yaml,yml}"
      run: bunx oxfmt --check {staged_files}
    modularity:
      run: bun run modularity:staged
    purity:
      run: bun run test:purity:staged
    test:
      run: bun run test:changed

commit-msg:
  parallel: false
  commands:
    attribution-guard:
      run: bun scripts/git/commit-msg-guard.ts {1}

pre-push:
  parallel: false
  commands:
    sync:
      run: bun run sync
    typecheck:
      run: bun run typecheck
    modularity:
      run: bun run modularity:check
    purity:
      run: bun run test:purity
    test:
      run: bun run test:coverage
