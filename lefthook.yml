# Lefthook Git Hooks Configuration
#
# Pre-commit runs fast typechecks, lint, and format checks.
# Pre-push runs only the local skill synchronization.
# Unit tests and build are handled during development by implementers and critics.

pre-commit:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    lint:
      run: bun run lint
    format-check:
      run: bun run format:check

pre-push:
  commands:
    sync-local:
      run: bun run sync:local
