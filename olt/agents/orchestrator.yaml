    - "quota:freeze"
    - "quota:resume"
    - "doctor"
    - "orchestrator:supervise"
    - "summary:export"
    - "summary:view"
    - "finding:get"
    - "report:get"
    - "evidence:get"
    - "whoami"
    - "msg:send"
    - "msg:recv"
    - "msg:poll"
    - "worktree:create"
    - "worktree:land"
    - "worktree:list"
    - "worktree:clean"
    - "worktree:status"
    - "worktree:reclaim"
