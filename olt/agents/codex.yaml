provider: "codex"
display_name: "OpenAI Codex"
aliases:
  - "openai-codex"
  - "codex-cli"
config_path: "~/.codex/config.toml"
platform_mapping:
  host_id: "codex"
  supervisory_model: "gpt-5.6-sol"
  supervisory_thinking: "high"
  worker_model: "gpt-5.6-terra"
  worker_thinking: "high"
  supervisory_cadence_seconds: 900
  supervisory_cron: "*/15 * * * *"
  max_single_task_seconds: 300
  heartbeat_tick_seconds: 180
  watchdog_timeout_seconds: 900
dispatch:
  collaboration_group: "collaboration"
  tool: "spawn_agent"
  task_name_parameter: "task_name"
  message_parameter: "message"
  model_parameter: "model"
  reasoning_effort_parameter: "reasoning_effort"
  fork_turns_parameter: "fork_turns"
messaging:
  tool: "send_message"
  followup_tool: "followup_task"
agent_lifecycle:
  wait_tool: "wait_agent"
  interrupt_tool: "interrupt_agent"
  list_tool: "list_agents"
command_execution:
  tool: "exec"
supported_tiers:
  - 0
  - 1
  - 2
  - 3
capabilities:
  hierarchical_subagents: true
  task_path_hierarchy: "/root"
  concurrency_config_key: "agents.max_concurrent_threads_per_session"
  token_reporting: true
  native_resume: false
communication_contract:
  mandatory_turn_completion_actions:
    - "doctor:verify"
  protocol: "mailbox_ipc"
  mailbox_path: ".olt/mailboxes/{agent_id}/"
  lock_path: ".olt/locks/mailboxes/{agent_id}.lock"
  allowed_channels:
    - "msg:send"
    - "msg:recv"
    - "msg:poll"
  ban_raw_jsonl_reading: true
  forbid_native_messaging: true
permissions:
  may:
    - "Mandatory Pre-Completion Doctor Verification: Before completing any run, delivering any task handoff, or marking a wave completed, execute `bun harness.ts doctor --run <capsule>` and verify that `Healthy: yes`. If doctor reports errors (unapproved root files, stale locks, unmerged worktrees, or mailbox errors), immediately auto-heal and remediate before ending the turn."
    - "Continuous Active Execution & Immediate Dispatch: Never transition to idle or stop calling tools after authoring plans or populating .olt/task-queue.jsonl. Immediately invoke child subagents via `invoke_subagent` to execute ready wave lanes in parallel worktrees."
    - "Execute multi-agent operations using OpenAI Codex native tools (spawn_agent, send_message, followup_task, wait_agent, exec) compliant with tiered isolation and mailbox IPC."
  must_not:
    - "Use native host send_message tool or bypass mailbox IPC; all inter-agent traffic must flow strictly through bun harness.ts msg:send"
    - "Read or parse raw .jsonl files directly (backlog.jsonl, defects.jsonl, inbox.jsonl, outbox.jsonl); all state and messaging must flow strictly through Harness CLI commands"
    - "Bypass mandatory doctor verification before concluding supervisory rounds or task handoffs"
instructions: |
  # Host-Tool Interlock & Shielded Shell
  - Native host send_message tool is strictly banned; all inter-agent communications must flow through bun harness.ts msg:send.

  # OpenAI Codex Platform Adapter Contract

  ## Mandatory Doctor Pre-Completion Verification Guard
  Before completing any run, delivering any task handoff, or marking a wave completed, execute `bun harness.ts doctor --run <capsule>` and verify that `Healthy: yes`. If doctor reports errors (unapproved root files, stale locks, unmerged worktrees, or mailbox errors), immediately auto-heal and remediate before ending the turn.

  ## Continuous Active Execution & Immediate Dispatch Mandate
  Never transition to idle or stop calling tools after authoring plans or populating .olt/task-queue.jsonl. Immediately invoke child subagents via `spawn_agent` in the `collaboration` group to execute ready wave lanes in parallel worktrees.

  ## Canonical 4-Host Platform Mapping: OpenAI Codex
  - Tier 0-2 Supervisory Model: `gpt-5.6-sol` (Thinking: `high` / `xhigh`)
  - Tier 3 Worker Model: `gpt-5.6-terra` (Thinking: `high` / `xhigh`)
  - Supervisory Cadence: 15 minutes / 900s scheduler (`*/15 * * * *`)
  - Max Single Task SLA: 300s (5 minutes)
  - Concurrency Control: Configured via `~/.codex/config.toml` (`agents.max_concurrent_threads_per_session`)
  - Native Resume: Not supported (use `followup_task` on idle agents or recover harness lease and re-dispatch)
