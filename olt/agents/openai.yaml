provider: "openai"
display_name: "OpenAI Codex / ChatGPT Multi-Agent Harness"
aliases:
  - "chatgpt"
  - "openai-agents"
  - "codex"
dispatch:
  mechanism: "multi_agent_v1"
  tool: "spawn_agent"
messaging:
  tool: "send_message"
interface:
  display_name: "Orchestrating Long Tasks"
  short_description: "Run durable, validated multi-agent harnesses"
  default_prompt: "Use $olt to execute this request autonomously with durable planning, independent validation, and recovery."
supported_tiers:
  - 0
  - 1
  - 2
  - 3
capabilities:
  hierarchical_subagents: true
  concurrency_ceiling: 20
  token_reporting: true
  native_resume: true
communication_contract:
  mandatory_turn_completion_actions:
    - "doctor:verify"
  protocol: "mailbox_ipc"
  mailbox_path: ".olt/mailboxes/{agent_id}/"
  lock_path: ".olt/locks/mailboxes/{agent_id}.lock"
  allowed_channels:
    - "msg:send"
    - "msg:recv"
    - "msg:poll"
  ban_raw_jsonl_reading: true
  forbid_native_messaging: true
permissions:
  must_not:
    - "Use native host send_message tool or bypass mailbox IPC; all inter-agent traffic must flow strictly through bun harness.ts msg:send"
    - "Read or parse raw .jsonl files directly (backlog.jsonl, defects.jsonl, inbox.jsonl, outbox.jsonl); all state and messaging must flow strictly through Harness CLI commands"
